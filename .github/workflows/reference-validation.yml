name: Required CEC2014 reference validation

# Explicit integration setup; ordinary CI/tests never download references.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Set reference capture paths
        shell: bash
        run: |
          echo "CEC_BENCHMARKS_PATH=$RUNNER_TEMP/pymofl-reference-captures" >> "$GITHUB_ENV"
          echo "PYMOFL_REFERENCE_CAPTURE_ROOT=$RUNNER_TEMP/pymofl-reference-captures" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.22"
      - name: Sync locked integration dependencies
        run: uv sync --locked --extra dev --extra cli
      - name: Retrieve pinned official archive
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 60 --retry 2 \
            https://raw.githubusercontent.com/P-N-Suganthan/CEC2014/98488087d590c29aaded9978ccfe2a356d10dd63/cec14-c-code.zip \
            --output "$RUNNER_TEMP/cec14-c-code.zip"
          echo "1a210560398ca7a50be6adf1e5e90602222519ef23b6e31aba8847e109761876  $RUNNER_TEMP/cec14-c-code.zip" | sha256sum --check --strict
      - name: Capture approved source controls
        run: uv run --locked python scripts/capture_cec2014.py --archive "$RUNNER_TEMP/cec14-c-code.zip" --output "$PYMOFL_REFERENCE_CAPTURE_ROOT"
      - name: Create actual required manifest
        run: |
          uv run --locked python - <<'PY'
          import json
          import os
          from pathlib import Path
          from pyMOFL.reference_validation import prepare_reference_manifest
          manifest = prepare_reference_manifest(os.environ["PYMOFL_REFERENCE_CAPTURE_ROOT"])
          with (Path(os.environ["RUNNER_TEMP"]) / "required-manifest.json").open("x") as destination:
              json.dump(manifest, destination, allow_nan=False)
          PY
      - name: Execute all required scalar and batch references
        run: uv run --locked python scripts/verify_reference_manifest.py --capture-root "$PYMOFL_REFERENCE_CAPTURE_ROOT" --manifest "$RUNNER_TEMP/required-manifest.json" --report "$RUNNER_TEMP/required-report.json"
      - name: Verify numerical references and failure sensitivity
        run: uv run --locked python -m pytest tests/benchmark_suites/test_cec2014_validation.py tests/test_reference_validation.py tests/cli/test_validation_report.py --junitxml="$RUNNER_TEMP/required-tests.xml"
      - name: Reject any required skip or incomplete execution
        run: |
          uv run --locked python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((root / "required-report.json").read_text())
          if not report["success"] or report["scalar_executed"] != 450 or report["batch_executed"] != 450:
              raise SystemExit("Required reference execution is incomplete")
          cases = list(ET.parse(root / "required-tests.xml").iter("testcase"))
          if not cases or any(case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error")):
              raise SystemExit("Required integration contains skipped or unsuccessful tests")
          PY
