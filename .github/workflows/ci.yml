name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Sync
        run: uv sync --locked --extra dev --extra cli

      - name: Format check (ruff)
        run: uv run --locked ruff format --check .

      - name: Lint (ruff)
        run: uv run --locked ruff check .

      - name: Type check (ty)
        run: uv run --locked ty check src/pyMOFL/

      - name: Tests (pytest)
        run: uv run --locked pytest

      - name: Build distributions
        run: uv build --no-sources --build-constraints scripts/build-constraints.txt --out-dir /tmp/pymofl-artifacts

      - name: Export artifact dependency constraints
        run: uv export --locked --no-dev --extra cli --no-emit-project --output-file /tmp/pymofl-artifact-constraints.txt

      - name: Verify installed core and CLI artifacts
        run: uv run --locked python scripts/verify_installed_package.py --wheel /tmp/pymofl-artifacts --constraints /tmp/pymofl-artifact-constraints.txt

      - name: Verify minimum runtime dependencies
        if: matrix.python-version == '3.12'
        run: uv run --locked python scripts/verify_installed_package.py --wheel /tmp/pymofl-artifacts --constraints scripts/minimum-runtime-constraints.txt

      - name: Prune uv cache
        run: uv cache prune --ci
